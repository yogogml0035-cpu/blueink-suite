version: "1.0.0"
owner: 汽车事业群 AI 内容中台
last_reviewed: "2026-08-25"
scope: 所有品牌的对外文案、媒体供稿、传播口径、演讲与社会化内容

hard_rules:
  - id: G-EVID-001
    name: 事实与证据
    rule: "数字、日期、身份、名称、引语、因果、现状和未来承诺必须有本次授权来源；来源不支持时删除、降低主张强度或移到待确认项，不得用合理推断补齐。"
    allow: "明确标成分析判断且不冒充事实，并写清适用边界。"
    on_hit: "阻止交付；回到来源、改写或向老师确认。"
  - id: G-CLAIM-001
    name: 绝对化与排名
    rule: "第一、唯一、最高、领先、顶级、标杆等强主张必须同时具备来源、时间、比较范围、评价指标和比较对象；不能用近义词替换规避证据要求。"
    allow: "限定条件与主张在同一句或紧邻句完整出现，且本次来源明确授权。"
    on_hit: "阻止交付；补齐边界与来源，或改成可验证的自身事实。"
  - id: G-COMP-001
    name: 竞品与内部产品
    rule: "不得贬损、嘲讽、污名化竞品或自家其他产品，不得做无共同口径的优劣断言、选择性截取数据或攻击技术路线。"
    allow: "经授权的中性事实比较必须同时间、同范围、同指标、来源可核查；联合活动可以按品牌规则对等呈现友商。"
    on_hit: "阻止交付；改为自身能力、用户价值或对等事实表述。"
  - id: G-ATTR-001
    name: 主体与功劳归属
    rule: "品牌、公司、产品、人物与合作方主体必须准确；不得抢合作方功劳、替合作方发布数据、把相关性写成单一因果或混入其他品牌口径。"
    allow: "本次授权材料已明确主体、合作分工和可披露范围。"
    on_hit: "阻止交付；校正主体、分工和因果强度。"
  - id: G-STATE-001
    name: 状态、时态与安全
    rule: "必须区分已交付、已推送、技术预览、计划和目标；辅助驾驶不得写成自动驾驶，不得作零事故、完全避免、绝对安全等承诺。"
    allow: "自动驾驶仅用于来源明确支持的 L4、Robotaxi、道路测试或部门名称等确切语境。"
    on_hit: "阻止交付；恢复真实状态、能力边界和必要安全提示。"
  - id: G-QUOTE-001
    name: 引语、保密与素材授权
    rule: "不得代拟引语冒充原话、合并不同人物发言，或披露内部代号、未发布功能、非公开数据、个人信息和未授权图片。"
    allow: "明确标为建议稿的代拟表达不冒充原话；公开素材仍须符合本次授权范围。"
    on_hit: "阻止交付；删除、匿名化、改标建议稿或取得授权。"
  - id: G-COMPLY-001
    name: 敏感与合规
    rule: "不得恶意蹭社会事件，不输出低俗、歧视、政治投机或无依据的宏大社会判断；财经、证券和经营信息只按经过批准的披露口径处理。"
    allow: "任务明确要求且有已批准口径、可靠来源和适当语境。"
    on_hit: "阻止交付；删除越界内容或交由授权负责人裁决。"

expression_defaults:
  - id: C-CLEAR-001
    name: 清晰具体
    rule: "事实先于评价，用明确主体、动作和结果代替空洞形容词；一句只承载一个主要关系，因果和比较范围要清楚。"
  - id: C-CONSIST-001
    name: 全文一致
    rule: "同一对象的名称、简称、数字精度、单位、时间和状态保持一致；相对时间必须能映射到实际发布时点。"
  - id: C-PUNCT-001
    name: 中文书写
    rule: "中文正文使用中文标点，避免重复粘贴、机械排比、连续口号以及过密的破折号、冒号和分号。"
  - id: C-VOICE-001
    name: 场景适配
    rule: "情绪、口语化程度和篇章结构服从品牌、体裁、渠道与发言人；品牌或品类规则可以覆盖本组默认值，但不能覆盖 hard_rules。"
