# 工作空间模板
#
# 这份文件是 .blueink/workspace.yaml 的注释版。正常情况下不用手抄——
#   python3 scripts/blueink.py bind --brand <品牌> --teacher <文案老师> --kb <目录>
# 会生成它。需要手工修 corpus_layout 或补 notes 时照这里改。
#
# 位置：**项目内** .blueink/workspace.yaml，不在技能目录里。
# 技能本体不含任何品牌语料，也不含任何绝对路径——复制技能不会带走绑定和记忆。

version: 2

# 写进稿子要认的品牌名。跨品牌污染检查拿它比对正文里出现的品牌实体。
brand: 理想汽车

# 只含 ASCII 的短标识，用于文件名与索引。不填则自动推导。
brand_key: lixiang

# 负责这个品牌的文案老师。**决定条件化记忆的归属。**
# 留空时记忆标成"未记名"，doctor 会持续提示补上；同一项目换人使用会混合偏好，
# 审计 A6 在同一记忆库里发现两个署名时判违约。
teacher: 张老师

# 该品牌知识库目录的绝对路径。必须绑到**具体品牌那一级**：
# 现代汽车下面还有 现代中国 与 现代N品牌 两个同级品牌，绑在 现代汽车 这一层
# 等于同时打开两套调性。bind 会直接拦住这种情况（要绕过需 --force）。
kb_root: /绝对路径/到/单个品牌的知识库

bound_at: 2026-08-22

# 官方来源白名单。写入时统一归一化成主机名：
#   - 可以直接粘完整 URL，路径会被丢掉并告知（白名单是主机级的）
#   - www. 前缀归一化到主域，否则 https://lixiang.com/... 会被自己的白名单拦住
#   - 匹配规则：主机名等于该域名，或是它的子域
# 联网取证前必须过 `official check-url`，退出码非 0 就不访问。
official_sources:
  - name: lixiang.com
    url: https://lixiang.com

# 语料布局。**可以留空**——空的时候索引按文件名和路径关键词自动判断证据类型。
# 填了就优先按它判断，准确度更高。键是证据类型，值是 kb_root 下的相对目录。
corpus_layout:
  原文资产: 02-原文资产
  初终稿对比: 03-初终稿对比
  经验总结: 04-经验总结原稿
  成品参考: 05-成品参考

# 这个工作空间的特殊约定。例如："绑定到现代 N 品牌，不是现代中国"。
notes: ""
